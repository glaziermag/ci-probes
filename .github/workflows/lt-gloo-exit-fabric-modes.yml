# Which invocation reproduces the abort? CI runs pytest under coverage with
# --timeout=60; a plain pytest loop gave 0/75. Same install as
# lt-gloo-exit-fabric.yml, i.e. with the repo installed as in ci-tests-fabric.yml at 84df182f5
# (ubuntu-22.04, Python 3.12, torch 2.12 CPU, PACKAGE_NAME=fabric).
name: lt-gloo-exit-fabric-modes
on:
  push:
    paths: [".github/workflows/lt-gloo-exit-fabric-modes.yml"]
  workflow_dispatch:
jobs:
  loop:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arm: [base, fix]
        mode: [cov_timeout, cov, timeout]
        shard: [1, 2]
        exclude:
          - { arm: fix, mode: cov }
          - { arm: fix, mode: timeout }
    env:
      PACKAGE_NAME: fabric
      TORCH_URL: "https://download.pytorch.org/whl/cpu/"
      FREEZE_REQUIREMENTS: "false"
      UV_TORCH_BACKEND: "cpu"
      UV_EXCLUDE_NEWER: "2 days"
      GLOO_SOCKET_IFNAME: eth0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Lightning-AI/pytorch-lightning
          ref: 84df182f50ab34301aabb3c0eb4031815bfb413d
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Apply the change from the issue (atexit destroy for every backend)
        if: matrix.arm == 'fix'
        run: |
          python - <<'PY'
          import pathlib
          p = pathlib.Path("src/lightning/fabric/utilities/distributed.py")
          s = p.read_text()
          old = ('    if torch_distributed_backend == "nccl":\n'
                 '        # PyTorch >= 2.4 warns about undestroyed NCCL process group, so we need to do it at program exit\n'
                 '        atexit.register(_destroy_dist_connection)\n')
          assert old in s, "patch anchor not found"
          p.write_text(s.replace(old, '    atexit.register(_destroy_dist_connection)\n'))
          PY
          git diff
      - name: Install (as ci-tests-fabric.yml, fabric 2.12)
        run: |
          uv pip install -q -r .actions/requirements.txt
          uv pip install -q -r requirements/ci.txt
          python -m wget https://raw.githubusercontent.com/Lightning-AI/utilities/main/scripts/adjust-torch-versions.py
          for fpath in `ls requirements/**/*.txt`; do python ./adjust-torch-versions.py $fpath 2.12; done
          uv pip install ".[test,strategies]" --upgrade --find-links="${TORCH_URL}"
          uv pip install "setuptools<80.10.3"
          python .actions/assistant.py copy_replace_imports --source_dir="./tests" \
            --source_import="lightning.fabric" --target_import="lightning_fabric"
          rm -rf src/
          python -c "import torch; print('torch', torch.__version__)"
          python -c "import inspect, lightning_fabric.utilities.distributed as d; s=inspect.getsource(d._init_dist_connection); print('ARM-CHECK', 'nccl-only' if 'if torch_distributed_backend == \"nccl\"' in s else 'all-backends')"
      - name: Reproduction loop
        run: |
          case "${{ matrix.mode }}" in
            cov_timeout) RUN="python -m coverage run --source lightning_fabric -m pytest"; EXTRA="--timeout=60" ;;
            cov)         RUN="python -m coverage run --source lightning_fabric -m pytest"; EXTRA="" ;;
            timeout)     RUN="python -m pytest"; EXTRA="--timeout=60" ;;
          esac
          cd tests/tests_fabric
          for i in $(seq 25); do
            $RUN "plugins/precision/test_amp_integration.py::test_amp" -k cpu -q -p no:cacheprovider $EXTRA > run.log 2>&1
            grep -q "terminate called without an active exception" run.log && echo "$i: aborted" || echo "$i: $(tail -n 1 run.log)"
          done | tee loop.txt
          echo "RESULT arm=${{ matrix.arm }} mode=${{ matrix.mode }} shard=${{ matrix.shard }} aborted=$(grep -c ': aborted' loop.txt) of 25"
