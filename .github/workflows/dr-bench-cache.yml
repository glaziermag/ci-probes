# Upstream: delta-io/delta-rs .github/workflows/python_benchmark.yml @ ccaa2782 (2026-11-06)
# Question: does ./cache/benchmark-data.json advance past the run that created the cache?
# Arm 'fix' runs on branch drv-fix. Caches are branch-scoped, so the cache step below is
# byte-for-byte the step proposed in the PR.
# Benchmark output is synthetic (dr-bench/value.txt); action SHAs match upstream.
name: dr-bench-exact-fix
on:
  push:
    paths: [".github/workflows/dr-bench-cache.yml", "dr-bench/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # Download previous benchmark result from cache (if exists)
      - name: Download previous benchmark data
        # v5.0.4 <https://github.com/actions/cache/releases/tag/v5.0.4>
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: ./cache
          # A cache entry is never updated after a hit on its key, so key each run
          # uniquely and restore the newest earlier one.
          key: ${{ runner.os }}-benchmark-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-benchmark

      - name: Show restored data
        run: python3 dr-bench/show.py cache/benchmark-data.json RESTORED

      - name: Run benchmark (synthetic)
        run: python3 dr-bench/fake.py output.json

      - name: Store benchmark result
        # <https://github.com/benchmark-action/github-action-benchmark/releases/tag/v1.21.0>
        uses: benchmark-action/github-action-benchmark@a7bc2366eda11037936ea57d811a43b3418d3073
        with:
          tool: "pytest"
          output-file-path: output.json
          external-data-json-path: ./cache/benchmark-data.json
          fail-on-alert: true

      - name: Show data after the action
        if: always()
        run: python3 dr-bench/show.py cache/benchmark-data.json AFTER
